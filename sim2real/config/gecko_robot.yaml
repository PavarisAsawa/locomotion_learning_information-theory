feet:
  # ASSUMPTION: force_scale inferred from the `norm/10` in the original
  # DynamixelSensorInterface demo; torque_scale is a guess by analogy.
  # Both need calibration against a known load.
  force_scale: 0.1            # raw int16 -> N
  torque_scale: 0.1           # raw int16 -> Nm
  contact_threshold_n: 4.0
  # Magnetic contact detection (gecko_control_node): contact when the raw field
  # deviates from its unloaded baseline by more than contact_threshold_mag (raw
  # counts). Baseline is averaged from contact_calibration_samples readings at
  # startup with feet UNLOADED. threshold is a placeholder -- tune it against
  # the /gecko/foot_contact_deviation topic.
  contact_threshold_mag: 150
  contact_calibration_samples: 50
  # Listed in sensor-id order (1,2,3,4), which IS the foot observation vector
  # order the policies were trained against -- do not reorder. The leg names are
  # the real wiring, confirmed by the robot's owner.
  sensors:
    - {name: rl, id: 1}
    - {name: rr, id: 2}
    - {name: fr, id: 3}
    - {name: fl, id: 4}

imu:
  i2c_bus: 1
  address: 0x6A
  frame_id: imu_link
  accel_fs_g: 2               # scale factor is derived from this, not hardcoded
  gyro_fs_dps: 250            # the original hardcoded the +-125 dps constant here
  madgwick_beta: 0.04
  calibration_samples: 200

safety:
  command_timeout: 0.5        # s without a command -> hold pose and warn
  home_ramp_seconds: 2.0
